<script>
const D=[{"n": "01", "g": "6", "t": "Playing Out", "s": "Receiving & Building from the Back", "d": "Takes the ball from the keeper and the full-backs under pressure, and starts the move."}, {"n": "02", "g": "6", "t": "Breaking Lines", "s": "Forward Passes & Switches", "d": "Passes that take a line of players out of the game: into midfield, into the striker, or across the pitch."}, {"n": "03", "g": "6", "t": "Driving Out", "s": "Carrying the Ball into Midfield", "d": "Steps past the first press with the ball at his feet and carries it into midfield."}, {"n": "04", "g": "8", "t": "Defending the Space", "s": "Cover, Recovery Runs & Interceptions", "d": "Reads the danger early: covers behind, recovers at pace and cuts out the pass."}, {"n": "05", "g": "8", "t": "Winning the Duel", "s": "Front-Foot Defending, Tackles & Headers", "d": "Steps in on the front foot and wins it: tackles, duels and headers."}];
const KEYS="<button class=\"ki g6\" data-k=\"0\"><b>01</b><span><strong>Playing Out</strong><em>Receiving & Building from the Back</em></span></button><button class=\"ki g6\" data-k=\"1\"><b>02</b><span><strong>Breaking Lines</strong><em>Forward Passes & Switches</em></span></button><button class=\"ki g6\" data-k=\"2\"><b>03</b><span><strong>Driving Out</strong><em>Carrying the Ball into Midfield</em></span></button><button class=\"ki g8\" data-k=\"3\"><b>04</b><span><strong>Defending the Space</strong><em>Cover, Recovery Runs & Interceptions</em></span></button><button class=\"ki g8\" data-k=\"4\"><b>05</b><span><strong>Winning the Duel</strong><em>Front-Foot Defending, Tackles & Headers</em></span></button>";
const kl=document.getElementById('klist'); kl.innerHTML=KEYS;
kl.querySelectorAll('.ki')[3].insertAdjacentHTML('beforebegin','<div class="grp g8">Off the ball &middot; 04&ndash;05</div>');
function sel(k){document.querySelectorAll('.seg,.ki').forEach(e=>e.classList.toggle('on',+e.dataset.k===k));
 const s=D[k],c=document.getElementById('card'); document.getElementById('five').setAttribute('class','s'+s.g); c.className='card g'+s.g; document.getElementById('cn').textContent=s.n+' · '+(s.g==='6'?'ON THE BALL':'OFF THE BALL');
 document.getElementById('ct').textContent=s.t; document.getElementById('cs').textContent=s.s; document.getElementById('cd').textContent=s.d;}
document.querySelectorAll('.seg,.ki').forEach(e=>{['mouseenter','click','focus'].forEach(ev=>e.addEventListener(ev,()=>sel(+e.dataset.k)));});
document.querySelector('.tapnote').textContent=matchMedia('(hover:none)').matches?'Tap a part of the 5.':'Hover over a part of the 5.';
sel(0);
</script></body></html>
