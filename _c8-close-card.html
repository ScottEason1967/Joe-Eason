<!doctype html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; }
body { position:relative; font-family:'Oswald','Arial Narrow',sans-serif;
  background:linear-gradient(135deg,#0b2350 0%,#0f2a55 55%,#16365f 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:80px 92px; position:relative; overflow:hidden; }
/* amber wash, same as the site's End Product band */
body::before { content:''; position:absolute; top:-40%; right:-12%; width:62%; height:200%;
  background:radial-gradient(circle closest-side, rgba(255,185,29,.16), transparent 100%); pointer-events:none; }
body > * { position:relative; z-index:1; }

.mark { font-weight:700; font-size:104px; line-height:1; letter-spacing:1px; text-transform:uppercase; color:#fff; }
.ep10-r { position:relative; display:inline-block; }
.ep10-stem { position:absolute; left:0; top:0; color:#FFB91D; clip-path:inset(0 60% 0 0); }
.ep10-o { color:#FFB91D; }

.eyebrow { color:#FFB91D; font-weight:600; font-size:27px; letter-spacing:7px; text-transform:uppercase; margin-bottom:26px; }
.rule { width:92px; height:5px; background:#FFB91D; border-radius:3px; margin:22px 0 26px; }

.shot { width:400px; height:400px; border-radius:16px; overflow:hidden;
  border:4px solid rgba(255,255,255,.14); box-shadow:0 20px 56px rgba(0,16,40,.5); }
.shot img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }

.pill { display:inline-flex; align-items:center; gap:14px; background:var(--c); color:#0b2350; font-weight:700; font-size:29px;
  letter-spacing:3px; padding:13px 30px; border-radius:11px; text-transform:uppercase; margin-top:38px; }

.foot { margin-top:36px; text-align:center; }
.jname { color:#fff; font-weight:700; font-size:54px; line-height:1; letter-spacing:1px; }
.jrole { color:#9db4d6; font-weight:500; font-size:24px; letter-spacing:3.5px; margin-top:9px; text-transform:uppercase; }
.url { color:#FFB91D; font-weight:700; font-size:38px; letter-spacing:2px; margin-top:26px; }

body { --c:#5aa9ff; --c2:#5aa9ff; }
body.g8 { --c:#FFB91D; --c2:#FFB91D; } body.gh { --c:#5aa9ff; --c2:#FFB91D; }
body::before { background:radial-gradient(circle closest-side, color-mix(in srgb, var(--c2) 16%, transparent), transparent 100%); }
.eyebrow, .grad { background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.rule { background:linear-gradient(90deg,var(--c),var(--c2)); }
.mark { font-size:96px; text-align:center; }
.sub { color:#fff; opacity:.9; font-weight:600; font-size:40px; letter-spacing:3px; text-transform:uppercase; margin-top:10px; text-align:center; }
.pill { background:linear-gradient(90deg,var(--c),var(--c2)); }
.pill .nx { opacity:.75; }
.shot { width:360px; height:360px; border-color:color-mix(in srgb, var(--c2) 40%, transparent); }
.url { background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
</style></head>
<body>
  <div class="eyebrow" id="eyebrow">What you&rsquo;ve just seen</div>
  <div class="mark" id="mark"></div>
  <div class="sub" id="sub"></div>
  <div class="rule"></div>
  <div class="shot"><img id="photo" alt=""></div>
  <span class="pill"><span class="nx">Next &rarr;</span><span id="next"></span></span>
  <div class="foot">
    <div class="jname">JOE EASON</div>
    <div class="jrole">Central Midfielder &middot; The Complete 8</div>
    <div class="url">joeeason8.com</div>
  </div>
<script>
const q=new URLSearchParams(location.search);
document.body.classList.add('g'+(q.get('g')||'6'));
document.getElementById('mark').innerHTML=q.get('t')||'';
const s=document.getElementById('sub'); if(q.get('s')) s.textContent=q.get('s'); else s.remove();
document.getElementById('next').textContent=q.get('next')||'';
const p=document.getElementById('photo'); const im=q.get('img')||''; p.src=im.includes('/')?im:'img/'+im; p.style.objectPosition=q.get('pos')||'center';
if(q.get('zoom')){p.style.transformOrigin=q.get('zo')||'center'; p.style.transform='scale('+q.get('zoom')+')';}
</script>
</body></html>
