<!doctype html>
<html><head><meta charset="utf-8">
<!-- Short card shown inside each Complete 8 video, between groups of clips.
     ?g=6|h|8&e=EYEBROW&t=TITLE&i=1&of=4 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; }
body { position:relative; font-family:'Oswald','Arial Narrow',sans-serif; overflow:hidden;
  background:linear-gradient(135deg,#0b2350 0%,#0f2a55 55%,#16365f 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 92px;
  --c:#5aa9ff; --c2:#5aa9ff; }
body.g8 { --c:#FFB91D; --c2:#FFB91D; }
body.gh { --c:#5aa9ff; --c2:#FFB91D; }
body::before { content:''; position:absolute; top:-40%; right:-12%; width:62%; height:200%;
  background:radial-gradient(circle closest-side, color-mix(in srgb, var(--c2) 16%, transparent), transparent 100%); }
body > * { position:relative; z-index:1; }
.grad { background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.eyebrow { font-weight:600; font-size:34px; letter-spacing:8px; text-transform:uppercase; margin-bottom:30px; }
.title { color:#fff; font-weight:700; font-size:190px; line-height:1.05; letter-spacing:2px; text-transform:uppercase; text-align:center; white-space:nowrap; }
.title.long { font-size:150px; }
.title.xlong { font-size:124px; }
.rule { width:140px; height:9px; border-radius:5px; margin:40px 0 34px; background:linear-gradient(90deg,var(--c),var(--c2)); }
.dots { display:flex; gap:16px; }
#badges { display:flex; gap:22px; margin-top:44px; }
#badges:empty { display:none; }
#badges svg { display:block; }
.dots i { width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.18); }
.dots i.on { background:linear-gradient(90deg,var(--c),var(--c2)); }
.foot { position:absolute; bottom:64px; left:0; right:0; text-align:center; }
.foot .jname { color:#fff; font-weight:700; font-size:34px; letter-spacing:2px; }
.foot .jrole { color:#6f89b4; font-weight:500; font-size:20px; letter-spacing:3px; margin-top:6px; text-transform:uppercase; }
/* 16 Nov 2026: the 10 (End Product) is maroon: #A3233A for the number, bars, rings and badge; #e07a8c where small maroon text sits on navy (same as the site) */
body.g10 { --c:#A3233A; --c2:#A3233A; }
body.g10 .grad { background:linear-gradient(90deg,#e07a8c,#e07a8c); -webkit-background-clip:text; background-clip:text; }
.ep10-r { position:relative; display:inline-block; }
.ep10-stem { position:absolute; left:0; top:0; color:#A3233A; clip-path:inset(0 60% 0 0); }
.ep10-o { color:#A3233A; }
</style></head>
<body>
  <div class="eyebrow grad" id="eyebrow"></div>
  <div class="title" id="title"></div>
  <div class="rule"></div>
  <div class="dots" id="dots"></div>
  <div id="badges"></div>
  <div class="foot">
    <div class="jname">JOE EASON</div>
    <div class="jrole">Central Midfielder &middot; The Complete 8</div>
  </div>
<script>
const q=new URLSearchParams(location.search);
/* 14 Nov 2026: optional role= (line under the name), bc= (badge colour) and a 5 badge, for The Modern 5 centre-back cards */
if(q.get('role')) document.querySelectorAll('.jrole').forEach(e=>e.textContent=q.get('role'));
document.body.classList.add('g'+(q.get('g')||'6'));
document.getElementById('eyebrow').textContent=q.get('e')||'';
const t=document.getElementById('title'); t.innerHTML=q.get('t')||''; const L=(q.get('t')||'').replace(/&amp;/g,'&').length; if(L>22) t.classList.add('xlong'); else if(L>16) t.classList.add('long');
const i=+(q.get('i')||1), of=+(q.get('of')||1), d=document.getElementById('dots');
for(let k=1;k<=of;k++){const x=document.createElement('i'); if(k===i) x.className='on'; d.appendChild(x);}
// optional 6 / 8 badges beside the name (?b=6 | 8 | 68), same design as the video rings.
// Fine-tuning (in badge units): ty = shift the digit down so it sits centrally in the circle;
// x6 / x8 = shift the star disc sideways so it sits centrally in the digit's bottom loop.
document.fonts.ready.then(function(){const b=q.get('b'); if(!b) return; const box=document.getElementById('badges');
 const TY=+(q.get('ty')||0);
 for(const d of (b.match(/10|\d/g)||[])){ const C=q.get('bc')||(d==='6'?'#5aa9ff':d==='10'?'#A3233A':'#FFB91D'), k=+(q.get("bk")||1.25), R=40*k, S=2*(R+14*k);
  const DY=(d==='6'?6.75:d==='5'?+(q.get('y5')||8):10)+TY, DX=+(q.get('x'+d)||(d==='6'?0.16:0)), DR=10.5, cx=S/2, cy=S/2, sx=cx+DX*k, sy=cy+DY*k;
  let X=sx, Y=sy, TX=cx, TYy=cy+(21+TY)*k, FS=60*k, DRk=DR*k, ten='';
  if(d==='10'){ /* 16 Nov 2026 (rev 3, option F): the 10 (End Product). A solid 0 (its usual pill-shaped hole filled in), drawn a quarter wider than the font's 0,
     with a big star-shaped hole punched through it whose points break the 0's sides; the star is the navy behind it.
     f10 = digit size, w10 = how much wider the 0 is, s10 = star width as a share of the 0's width, h10 = how much taller than a normal star. Hole/centre figures measured from Oswald 700. */
   FS=+(q.get('f10')||48)*k; const zx=+(q.get('w10')||1.25), g=document.createElement('canvas').getContext('2d'); g.font='700 '+FS+'px Oswald';
   const m1=g.measureText('1'), m0=g.measureText('0'), w1=m1.width, A0=m0.actualBoundingBoxAscent;
   const x1=cx-((-m1.actualBoundingBoxLeft)+(w1+m0.actualBoundingBoxRight*zx))/2, x0=x1+w1, bl=cy+A0/2; /* pair centred on its ink */
   const sX=x0+0.2745*FS*zx, sY=bl-0.404*FS, ro=+(q.get('s10')||1.0)*0.441*FS*zx/1.902, sy=+(q.get('h10')||1.15); let sp=[];
   for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,t=i%2?ro*0.45:ro; sp.push((sX+t*Math.cos(a)).toFixed(2)+','+(sY+t*Math.sin(a)*sy).toFixed(2))}
   ten=`<mask id="m10" maskUnits="userSpaceOnUse" x="0" y="0" width="${S}" height="${S}"><rect width="${S}" height="${S}" fill="#fff"/><polygon points="${sp.join(' ')}" fill="#000"/></mask>
  <text x="${x1}" y="${bl}" font-family="Oswald" font-weight="700" font-size="${FS}" fill="${C}">1</text>
  <g mask="url(#m10)"><g transform="translate(${x0} 0) scale(${zx} 1)" fill="${C}"><text x="0" y="${bl}" font-family="Oswald" font-weight="700" font-size="${FS}">0</text><rect x="${0.195*FS}" y="${bl-0.703*FS}" width="${0.16*FS}" height="${0.598*FS}" rx="${0.08*FS}"/></g></g>`; }
  const SR=DRk/(DR*k);
  let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,t=(i%2?DR*0.62*k*0.45:DR*0.62*k)*SR;p.push((X+t*Math.cos(a)).toFixed(2)+','+(Y+t*Math.sin(a)).toFixed(2))}
  box.insertAdjacentHTML('beforeend',`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><defs><filter id="g${d}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${6*k}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <circle cx="${cx}" cy="${cy}" r="${R+3*k}" fill="rgba(8,22,46,.85)"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#0b2350" stroke="${C}" stroke-width="${4*k}" filter="url(#g${d})"/>
  ${ten||`<text x="${TX}" y="${TYy}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="${FS}" fill="${C}">${d}</text>
  <circle cx="${X}" cy="${Y}" r="${DRk}" fill="${C}" stroke="#fff" stroke-width="${1.3*k}"/><polygon points="${p.join(' ')}" fill="#0b2350"/>`}</svg>`);}});
</script>
</body></html>
