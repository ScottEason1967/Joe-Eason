<!doctype html>
<html><head><meta charset="utf-8">
<!-- Short card shown inside each Complete 8 video, between groups of clips.
     ?g=6|h|8&e=EYEBROW&t=TITLE&i=1&of=4 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; }
body { position:relative; font-family:'Oswald','Arial Narrow',sans-serif; overflow:hidden;
  background:linear-gradient(135deg,#0b2350 0%,#0f2a55 55%,#16365f 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 92px;
  --c:#5aa9ff; --c2:#5aa9ff; }
body.g8 { --c:#FFB91D; --c2:#FFB91D; }
body.gh { --c:#5aa9ff; --c2:#FFB91D; }
body::before { content:''; position:absolute; top:-40%; right:-12%; width:62%; height:200%;
  background:radial-gradient(circle closest-side, color-mix(in srgb, var(--c2) 16%, transparent), transparent 100%); }
body > * { position:relative; z-index:1; }
.grad { background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.eyebrow { font-weight:600; font-size:34px; letter-spacing:8px; text-transform:uppercase; margin-bottom:30px; }
.title { color:#fff; font-weight:700; font-size:190px; line-height:1.05; letter-spacing:2px; text-transform:uppercase; text-align:center; white-space:nowrap; }
.title.long { font-size:150px; }
.title.xlong { font-size:124px; }
.rule { width:140px; height:9px; border-radius:5px; margin:40px 0 34px; background:linear-gradient(90deg,var(--c),var(--c2)); }
.dots { display:flex; gap:16px; }
#badges { display:flex; gap:22px; margin-top:44px; }
#badges:empty { display:none; }
#badges svg { display:block; }
.dots i { width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.18); }
.dots i.on { background:linear-gradient(90deg,var(--c),var(--c2)); }
.foot { position:absolute; bottom:64px; left:0; right:0; text-align:center; }
.foot .jname { color:#fff; font-weight:700; font-size:34px; letter-spacing:2px; }
.foot .jrole { color:#6f89b4; font-weight:500; font-size:20px; letter-spacing:3px; margin-top:6px; text-transform:uppercase; }
</style></head>
<body>
  <div class="eyebrow grad" id="eyebrow"></div>
  <div class="title" id="title"></div>
  <div class="rule"></div>
  <div class="dots" id="dots"></div>
  <div id="badges"></div>
  <div class="foot">
    <div class="jname">JOE EASON</div>
    <div class="jrole">Central Midfielder &middot; The Complete 8</div>
  </div>
<script>
const q=new URLSearchParams(location.search);
document.body.classList.add('g'+(q.get('g')||'6'));
document.getElementById('eyebrow').textContent=q.get('e')||'';
const t=document.getElementById('title'); t.innerHTML=q.get('t')||''; const L=(q.get('t')||'').replace(/&amp;/g,'&').length; if(L>22) t.classList.add('xlong'); else if(L>16) t.classList.add('long');
const i=+(q.get('i')||1), of=+(q.get('of')||1), d=document.getElementById('dots');
for(let k=1;k<=of;k++){const x=document.createElement('i'); if(k===i) x.className='on'; d.appendChild(x);}
// optional 6 / 8 badges beside the name (?b=6 | 8 | 68), same design as the video rings.
// Fine-tuning (in badge units): ty = shift the digit down so it sits centrally in the circle;
// x6 / x8 = shift the star disc sideways so it sits centrally in the digit's bottom loop.
document.fonts.ready.then(function(){const b=q.get('b'); if(!b) return; const box=document.getElementById('badges');
 const TY=+(q.get('ty')||0);
 for(const d of b.split('')){ const C=d==='6'?'#5aa9ff':'#FFB91D', k=+(q.get("bk")||1.25), R=40*k, S=2*(R+14*k);
  const DY=(d==='6'?6.75:10)+TY, DX=+(q.get('x'+d)||(d==='6'?0.16:0)), DR=10.5, cx=S/2, cy=S/2, sx=cx+DX*k, sy=cy+DY*k;
  let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,t=i%2?DR*0.62*k*0.45:DR*0.62*k;p.push((sx+t*Math.cos(a)).toFixed(2)+','+(sy+t*Math.sin(a)).toFixed(2))}
  box.insertAdjacentHTML('beforeend',`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><defs><filter id="g${d}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${6*k}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <circle cx="${cx}" cy="${cy}" r="${R+3*k}" fill="rgba(8,22,46,.85)"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#0b2350" stroke="${C}" stroke-width="${4*k}" filter="url(#g${d})"/>
  <text x="${cx}" y="${cy+(21+TY)*k}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="${60*k}" fill="${C}">${d}</text>
  <circle cx="${sx}" cy="${sy}" r="${DR*k}" fill="${C}" stroke="#fff" stroke-width="${1.3*k}"/><polygon points="${p.join(' ')}" fill="#0b2350"/></svg>`);}});
</script>
</body></html>
