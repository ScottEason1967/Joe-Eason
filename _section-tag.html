<!doctype html>
<html><head><meta charset="utf-8">
<!-- Small corner tag shown for the whole of each section of a Complete 8 video (transparent 1920x1080 overlay).
     ?g=6|h|8&v=02 · Screening the Back Four&t=Interceptions&b=6|68|8 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; background:transparent; }
body { position:relative; font-family:'Oswald','Arial Narrow',sans-serif; --c:#5aa9ff; --c2:#5aa9ff; }
body.g8 { --c:#FFB91D; --c2:#FFB91D; }
body.gh { --c:#5aa9ff; --c2:#FFB91D; }
.tag { position:absolute; left:56px; bottom:52px; display:flex; align-items:center; gap:16px;
  background:rgba(8,22,46,.80); border-radius:14px; padding:10px 26px 12px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.35); }
.tag::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; border-radius:14px 0 0 14px;
  background:linear-gradient(180deg,var(--c),var(--c2)); }
#badges { display:flex; gap:8px; margin-left:6px; }
#badges svg { display:block; }
.txt { display:flex; flex-direction:column; }
.vid { font-weight:600; font-size:17px; letter-spacing:4px; text-transform:uppercase; line-height:1.2;
  background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.name { color:#fff; font-weight:700; font-size:42px; letter-spacing:1px; text-transform:uppercase; line-height:1.05; }
</style></head>
<body>
  <div class="tag">
    <div id="badges"></div>
    <div class="txt"><div class="vid" id="vid"></div><div class="name" id="name"></div></div>
  </div>
<script>
const q=new URLSearchParams(location.search);
document.body.classList.add('g'+(q.get('g')||'6'));
document.getElementById('vid').textContent=q.get('v')||'';
document.getElementById('name').innerHTML=q.get('t')||'';
// same 6 / 8 badge as the rings and the cards (ty / x6 / x8 = fine centring, in badge units)
document.fonts.ready.then(function(){const b=q.get('b')||'6'; const box=document.getElementById('badges');
 const TY=+(q.get('ty')||3.0);
 for(const d of b.split('')){ const C=d==='6'?'#5aa9ff':'#FFB91D', k=+(q.get("bk")||0.72), R=40*k, S=2*(R+14*k);
  const DY=(d==='6'?6.75:10)+TY, DX=+(q.get('x'+d)||(d==='6'?-0.25:-0.25)), DR=10.5, cx=S/2, cy=S/2, sx=cx+DX*k, sy=cy+DY*k;
  let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,t=i%2?DR*0.62*k*0.45:DR*0.62*k;p.push((sx+t*Math.cos(a)).toFixed(2)+','+(sy+t*Math.sin(a)).toFixed(2))}
  box.insertAdjacentHTML('beforeend',`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><defs><filter id="g${d}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${6*k}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <circle cx="${cx}" cy="${cy}" r="${R+3*k}" fill="rgba(8,22,46,.85)"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#0b2350" stroke="${C}" stroke-width="${4*k}" filter="url(#g${d})"/>
  <text x="${cx}" y="${cy+(21+TY)*k}" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="${60*k}" fill="${C}">${d}</text>
  <circle cx="${sx}" cy="${sy}" r="${DR*k}" fill="${C}" stroke="#fff" stroke-width="${1.3*k}"/><polygon points="${p.join(' ')}" fill="#0b2350"/></svg>`);}
 document.body.classList.add('ready');});
</script>
</body></html>
