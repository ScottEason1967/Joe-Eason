<!doctype html>
<html><head><meta charset="utf-8">
<!-- Opening card for each Complete 8 competency video. Filled in by the render script:
     ?n=01&g=6|h|8&t=TITLE&s=SUBTITLE&img=FILE&pos=X% Y% -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; }
body { display:flex; font-family:'Oswald','Arial Narrow',sans-serif;
  background:linear-gradient(135deg,#0b2350 0%,#0f2a55 55%,#16365f 100%); --c:#5aa9ff; --c2:#5aa9ff; }
body.g8 { --c:#FFB91D; --c2:#FFB91D; }
body.gh { --c:#5aa9ff; --c2:#FFB91D; }
.left { width:1180px; height:1080px; padding:80px 92px 78px; display:flex; flex-direction:column; position:relative; }
.num { font-weight:700; font-size:230px; line-height:1.1; padding-bottom:6px; margin-bottom:-40px; letter-spacing:2px; margin-top:20px;
  background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; opacity:.9; }
.block { margin-top:auto; }
.eyebrow { font-weight:600; font-size:30px; letter-spacing:7px; margin-bottom:34px; text-transform:uppercase;
  background:linear-gradient(90deg,var(--c),var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block; }
.title { color:#fff; font-weight:700; font-size:118px; line-height:.98; letter-spacing:1px; text-transform:uppercase; }
.title.long { font-size:96px; }
.subt { color:#fff; opacity:.9; font-weight:600; font-size:52px; letter-spacing:3px; text-transform:uppercase; margin-top:14px; }
.bar { width:120px; height:8px; border-radius:4px; margin-top:34px; background:linear-gradient(90deg,var(--c),var(--c2)); }
.name-row { margin-top:56px; }
.jname { color:#fff; font-weight:700; font-size:58px; line-height:1; letter-spacing:1px; }
.jrole { color:#9db4d6; font-weight:500; font-size:24px; letter-spacing:3px; margin-top:8px; text-transform:uppercase; }
.right { width:740px; height:1080px; position:relative; overflow:hidden; }
.right::before { content:''; position:absolute; left:0; top:0; bottom:0; width:10px; z-index:2; background:linear-gradient(180deg,var(--c),var(--c2)); }
.right img { width:100%; height:100%; object-fit:cover; display:block; }
</style></head>
<body>
  <div class="left">
    <div class="num" id="num"></div>
    <div class="block">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
      <div class="subt" id="subt"></div>
      <div class="bar"></div>
    </div>
    <div class="name-row">
      <div class="jname">JOE EASON</div>
      <div class="jrole">Central Midfielder &middot; The Complete 8</div>
    </div>
  </div>
  <div class="right"><img id="photo" alt=""></div>
<script>
const q=new URLSearchParams(location.search);
document.body.classList.add('g'+(q.get('g')||'6'));
document.getElementById('num').textContent=q.get('n')||'';
document.getElementById('eyebrow').textContent=q.get('e')||'';
const t=document.getElementById('title'); t.innerHTML=q.get('t')||''; if((q.get('t')||'').length>22) t.classList.add('long');
const s=document.getElementById('subt'); if(q.get('s')) s.textContent=q.get('s'); else s.remove();
const p=document.getElementById('photo'); const im=q.get('img')||''; p.src=im.includes('/')?im:'img/'+im; p.style.objectPosition=q.get('pos')||'center'; if(q.get('zoom')){p.style.transformOrigin=q.get('zo')||(q.get('pos')||'center'); p.style.transform='scale('+q.get('zoom')+')';}
</script>
</body></html>
